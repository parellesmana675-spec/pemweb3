<!DOCTYPE html>
<html lang="id">
<head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Education HTML</title>

      <style>
            body {
                font-family: "times new roman", sans-serif;
                background-color: white;
            }
            
            .container {   
                border: 2px solid gray;
                padding: 20px;
                margin: 30px;
            }

            h1{
                font-size: 48px;
                margin-bottom: 70px;
            }

            table{
                width: 100%;
                border: 2px solid #ccc;
                border-spacing: 5px;
            }

            caption{
                font-size: 32px;
                font-weight: bold;
                margin-bottom: 5px;
            }

            th, td{
                border: 2px solid #ccc;
                padding: 8px;
                text-align: left;
                font-size: 28px;
            }

            th{
                text-align: center;
            }
        </style>
</head>

<body>
    <div class="container"></div>
        <h1>Riwayat Pendidikan</h1>

        <table>
            <caption>Riwayat Pendidikan</caption>
            <thead>
                <tr>
                    <th>No</th>
                    <th>Jenjang</th>
                    <th>Nama Sekolah</th>
                    <th>Tahun</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>SD</td>
                    <td>SD SIDAMULYA</td>
                    <td>2014-2020</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>SMP</td>
                    <td>SMP NEGRI 3 CIPUNAGARA</td>
                    <td>2020-2023</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>SMK</td>
                    <td>SMA NEGRI 2 SUBANG</td>
                    <td>2023-2026</td>
                </tr>

            </tbody>
</body>
