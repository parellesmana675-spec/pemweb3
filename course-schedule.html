<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jadwal Kuliah</title>

    <style>
        body {
            font-family: "Times New Roman", serif;
            background-color: white;
        }

        .container {
            border: 2px solid gray;
            padding: 10px;
            margin: 20px;
        }

        h1 {
            font-size: 48px;
            margin-bottom: 70px;
        }

        table {
            width: 100%;
            border: 2px solid #ccc;
            border-spacing: 4px;
        }

        caption {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        th, td {
            border: 2px solid #ccc;
            padding: 8px;
            font-size: 28px;
            text-align: left;
        }

        th {
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="container">

        <h1>Jadwal Kuliah</h1>

        <table>
            <caption>Jadwal Kuliah Semester 1</caption>

            <tr>
                <th>Hari</th>
                <th>Jam</th>
                <th>Mata Kuliah</th>
                <th>Ruangan</th>
            </tr>

            <tr>
                <td>Senin</td>
                <td>08:00 - 10:00</td>
                <td>Pemrograman Web</td>
                <td>Lab 1</td>
            </tr>

            <tr>
                <td>Selasa</td>
                <td>10:00 - 12:00</td>
                <td>Basis Data</td>
                <td>Lab 2</td>
            </tr>

            <tr>
                <td>Rabu</td>
                <td>08:00 - 10:00</td>
                <td>Algoritma</td>
                <td>Ruang 201</td>
            </tr>

            <tr>
                <td>Kamis</td>
                <td>13:00 - 15:00</td>
                <td>Sistem Operasi</td>
                <td>Ruang 202</td>
            </tr>

            <tr>
                <td colspan="3">Kegiatan Mahasiswa</td>
                <td>Aula</td>
            </tr>

        </table>
    </div>
</body>
</html>
