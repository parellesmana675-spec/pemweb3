<!DOCTYPE html>
<html lang="id">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Formulid Pendaftaran</title>
        <link rel="stylesheet" href="form.css">
    </head>
    <body>
        <h2 class="judul">form.html</h2>

        <div class="container">
            <h2>Formulir Pendaftaran</h2>

            <form>
                <label for="nama">Nama Lengkap:</label>
            label><br>
                <input tyepe="text" id="nama" name="nama" paceholder="Masukkan
            nama"><br><br>
                <label for="email">Email:</label><br>
                <input type="'email" id="email"
            name="email"
placeholder="nama@domain.com"><br><br>  
                <label for="password">Password:</label><br>
                <input type ="password" id="password" name="password"><br><br>

                <label for="umur">Umur:</label><br>
                <input type="number"id="umur" name="umur"min="1" max="120"><br><br>

                <label for="tanggal">Tanggal Lahir:</label><br>
                <input type="date" id="tanggal" name="tanggal"><br><br>
                <label form ="jenis_kelamin">Jenis Kelamin:</label><br>
                <input type="radio" name="gender" valeu="Laki-laki">Laki-laki<br>
                input type="radio" name="gender" value="Perempuan">Perempuan<br><br>
                
                <label>hobi</label>br>
                <input type="checkbox" name="hobi" value="Coding">Coding<br>
                <input type="checkbox" name="hobi" value="Gaming">Gaming<br>
                <input type="checkbox" name="hobi" value="Olahraga">Olahraga<br><br>

                <label for="jurusan">Jurusan:</label><br>
                <select id="jurusan" name="jurusan">
                    <option value="">Pilih Jurusan</option>

                    <option value="Informatika">Informatika</option>
                    <option value="Sistem Informasi">Sistem Informasi</option>
                    <option value="Teknik Komputer Jaringan">Teknik Komputer Jaringan</option>
                </select><br><br>
            </form>

            <label for="alamat">Alamat:</label><br>
            <textarea id="alamat" name="alamat" placeholder="Masukkan alamat lengkap"></textarea><br><br>

            <label for="foto">Foto:</label><br>
            <input type="file" id="foto" name="foto"
            accept="image/*"><br><br>

            <label for="website">Website:</label><br>
            <input type="url" id="website" name="website"

            placeholder="https://www.example.com"><br><br>

            <buttom type="sumbit">krim</buttom>
            <buttom type="reset">Reset</buttom>
        </form>
    </div>

</body>
</html>
